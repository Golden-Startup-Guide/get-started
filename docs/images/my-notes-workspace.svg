  <text x="85" y="372" class="tiny muted" font-weight="700" letter-spacing="1.2">LIBRARIES</text>
  <path d="m88 393 5 5 5-5" fill="none" stroke="#7d827b" stroke-width="1.5"/>
  <text x="106" y="400" class="small ink" font-weight="650">Personal Library</text>
  <circle cx="98" cy="428" r="3" fill="#6c8c7d"/>
  <text x="110" y="433" class="small ink">General</text>
  <text x="110" y="459" class="tiny muted">Personal</text>
  <text x="110" y="483" class="tiny muted">Ideas</text>
  <text x="110" y="507" class="tiny muted">Research</text>
  <text x="110" y="531" class="tiny muted">Work</text>
