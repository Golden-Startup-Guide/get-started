  <text x="365" y="646" font-size="13" fill="#fffefa" font-weight="650">+  Create a note</text>

  <path d="M666 126v582" stroke="#e9e7df"/>
  <text x="704" y="165" font-size="20" font-weight="700" class="ink">Field notes from the garden</text>
  <text x="704" y="189" class="tiny muted">PERSONAL  ·  SAVED LOCALLY</text>
  <rect x="1108" y="148" width="76" height="29" rx="9" fill="#eef2ec"/>
  <circle cx="1124" cy="162" r="4" fill="#4f7668"/>
  <text x="1135" y="166" class="tiny ink">Saved</text>
  <path d="M704 210h480" stroke="#eeece5"/>
  <text x="704" y="253" font-size="22" font-weight="700" class="ink">A few things I noticed</text>
  <text x="704" y="287" font-size="14" class="ink">The first light reached the raised beds before seven.</text>
  <text x="704" y="312" font-size="14" class="ink">The mint is spreading faster than I expected.</text>
  <rect x="704" y="345" width="480" height="1" fill="#eeece5"/>
  <text x="704" y="380" class="tiny muted" font-weight="700" letter-spacing="1">TODAY'S CHECKLIST</text>
  <rect x="706" y="399" width="15" height="15" rx="4" fill="#4f7668"/>
  <path d="m710 406 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="733" y="411" class="small muted" text-decoration="line-through">Water the seedlings</text>
  <rect x="706" y="429" width="15" height="15" rx="4" fill="#fffefa" stroke="#c8cbc2"/>
  <text x="733" y="441" class="small ink">Add labels to the new herbs</text>
  <rect x="706" y="459" width="15" height="15" rx="4" fill="#fffefa" stroke="#c8cbc2"/>
  <text x="733" y="471" class="small ink">Share a clipping with Sam</text>
  <rect x="704" y="502" width="480" height="1" fill="#eeece5"/>
  <text x="704" y="536" class="tiny muted" font-weight="700" letter-spacing="1">CONNECTED NOTES</text>
  <rect x="704" y="552" width="214" height="43" rx="10" fill="#f5f4ef"/>
  <circle cx="723" cy="573" r="6" fill="#d6b77d"/>
  <text x="739" y="577" class="tiny ink">Spring planting plan</text>
  <rect x="930" y="552" width="254" height="43" rx="10" fill="#f5f4ef"/>
  <circle cx="949" cy="573" r="6" fill="#9db4a1"/>
  <text x="965" y="577" class="tiny ink">Herbs that thrive in shade</text>
  <rect x="704" y="618" width="480" height="45" rx="12" fill="#f7f6f1"/>
  <text x="723" y="645" class="tiny muted">Markdown preview  ·  History  ·  Attachments</text>

  <text x="640" y="735" text-anchor="middle" class="tiny muted">A calm space for capturing, organizing, and connecting your ideas.</text>
</svg>
