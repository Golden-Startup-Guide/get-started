  <path d="M310 126v582" stroke="#e9e7df"/>
  <rect x="84" y="150" width="36" height="36" rx="11" fill="url(#accent)"/>
  <path d="M94 162h16M94 168h16M94 174h11" stroke="#fffefa" stroke-width="2" stroke-linecap="round"/>
  <text x="130" y="173" font-size="17" font-weight="700" class="ink">My Notes</text>
  <text x="85" y="218" class="tiny muted" font-weight="700" letter-spacing="1.2">YOUR WORKSPACE</text>
  <rect x="77" y="232" width="220" height="36" rx="10" fill="#e6ece5"/>
  <circle cx="96" cy="250" r="5" fill="#4f7668"/>
  <text x="110" y="255" class="small ink" font-weight="650">All Notes</text>
  <text x="269" y="255" class="tiny muted">12</text>
  <circle cx="96" cy="289" r="5" fill="#c19d56"/>
  <text x="110" y="294" class="small ink">Favorites</text>
  <path d="M91 320h10v10H91z" fill="none" stroke="#8f7664" stroke-width="1.6" rx="2"/>
