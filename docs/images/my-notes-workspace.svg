  <rect x="355" y="278" width="32" height="4" rx="2" fill="#bd9860"/>
  <text x="355" y="304" font-size="15" font-weight="650" class="ink">Field notes from the garden</text>
  <text x="355" y="325" class="tiny muted">Observations, sketches, and small</text>
  <text x="355" y="342" class="tiny muted">things worth remembering...</text>
  <rect x="355" y="349" width="52" height="18" rx="9" fill="#e3e9df"/>
  <text x="366" y="362" font-size="9" class="ink">ideas</text>
  <text x="610" y="284" font-size="15" fill="#c59f56">★</text>
  <rect x="340" y="374" width="296" height="100" rx="13" fill="#fffefa" stroke="#eeece5"/>
  <text x="355" y="402" font-size="14" font-weight="650" class="ink">Reading list: systems &amp; design</text>
  <text x="355" y="424" class="tiny muted">Books and essays to return to when</text>
  <text x="355" y="441" class="tiny muted">I have a quiet afternoon...</text>
  <rect x="355" y="452" width="68" height="18" rx="9" fill="#f1eee5"/>
  <text x="366" y="465" font-size="9" class="ink">research</text>
  <rect x="340" y="486" width="296" height="100" rx="13" fill="#fffefa" stroke="#eeece5"/>
  <text x="355" y="514" font-size="14" font-weight="650" class="ink">A plan for the week</text>
  <text x="355" y="536" class="tiny muted">Make room for focused work and</text>
  <text x="355" y="553" class="tiny muted">time away from the screen...</text>
  <rect x="355" y="564" width="49" height="18" rx="9" fill="#e9e5ee"/>
  <text x="367" y="577" font-size="9" class="ink">work</text>
