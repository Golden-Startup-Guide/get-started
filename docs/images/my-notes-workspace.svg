  <text x="340" y="187" class="tiny muted">12 notes in your library</text>
  <rect x="340" y="207" width="296" height="37" rx="10" fill="#f5f4ef"/>
  <circle cx="358" cy="225" r="5" fill="none" stroke="#8a8e87" stroke-width="1.5"/>
  <path d="m362 229 4 4" stroke="#8a8e87" stroke-width="1.5" stroke-linecap="round"/>
