<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">My Notes workspace illustration</title>
  <desc id="description">An illustration of the My Notes app showing library navigation, searchable notes, linked-note context, and a Markdown editor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f1"/>
      <stop offset="1" stop-color="#e9eee8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7668"/>
      <stop offset="1" stop-color="#31584b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#33473d" flood-opacity=".12"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .muted { fill: #7d827b; }
      .ink { fill: #2e352f; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
    </style>
  </defs>
  <rect width="1280" height="760" rx="32" fill="url(#background)"/>
  <circle cx="1140" cy="110" r="165" fill="#d9e3da" opacity=".48"/>
  <circle cx="116" cy="676" r="190" fill="#e9dfcf" opacity=".45"/>

  <g filter="url(#shadow)">
    <rect x="64" y="52" width="1152" height="656" rx="22" fill="#fffefa"/>
    <path d="M86 52h1108a22 22 0 0 1 22 22v52H64V74a22 22 0 0 1 22-22Z" fill="#fbfaf6"/>
  </g>

  <circle cx="92" cy="89" r="6" fill="#d9897c"/>
  <circle cx="114" cy="89" r="6" fill="#e5c77d"/>
  <circle cx="136" cy="89" r="6" fill="#8fb59a"/>
  <rect x="457" y="74" width="366" height="30" rx="15" fill="#f1f0eb"/>
  <circle cx="475" cy="89" r="5" fill="#6c8c7d"/>
  <text x="491" y="94" class="tiny muted">MY NOTES  /  PERSONAL LIBRARY</text>

